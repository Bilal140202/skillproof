name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests (stdlib only, no install step)
        run: python -m unittest discover -s tests -t . -v

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: offline demo must run end-to-end
        run: python3 -m skillproof demo --out demo-artifacts
      - name: demo run must verify (hashes + records)
        run: python3 -m skillproof verify --run "$(ls -d demo-artifacts/results/*)"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo-artifacts/results/*/REPORT.md
          if-no-files-found: error
